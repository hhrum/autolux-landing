name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level env is inherited by withastro/action composite steps.
    # Token: prefer PUBLIC_GH_TOKEN, fall back to VITE_GH_TOKEN; secrets first, then vars.
    # Must be a Repository secret/variable (not only Environment "github-pages" — that job doesn't see those).
    env:
      PUBLIC_GH_TOKEN: ${{ secrets.PUBLIC_GH_TOKEN || secrets.VITE_GH_TOKEN || vars.PUBLIC_GH_TOKEN || vars.VITE_GH_TOKEN }}
      PUBLIC_GH_OWNER: hhrum
      PUBLIC_GH_REPO: autolux-landing
      PUBLIC_GH_MAIN_BRANCH: main
      PUBLIC_GH_DRAFT_BRANCH: draft
      PUBLIC_GH_WORKFLOW_FILE: deploy.yml
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Verify publish env
        run: |
          if [ -z "$PUBLIC_GH_TOKEN" ]; then
            echo "::error::PUBLIC_GH_TOKEN is empty."
            echo "Add a Repository secret named PUBLIC_GH_TOKEN (or VITE_GH_TOKEN) under:"
            echo "Settings → Secrets and variables → Actions → Repository secrets"
            echo "Environment secrets on github-pages are NOT visible to this build job."
            exit 1
          fi
          echo "PUBLIC_GH_TOKEN is set (${#PUBLIC_GH_TOKEN} chars)"
          echo "PUBLIC_GH_OWNER=$PUBLIC_GH_OWNER PUBLIC_GH_REPO=$PUBLIC_GH_REPO"
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
