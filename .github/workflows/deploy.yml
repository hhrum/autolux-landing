name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Admin publishing POC — baked into /admin client bundle.
          # Add repo secret: Settings → Secrets → Actions → VITE_GH_TOKEN
          VITE_GH_TOKEN: ${{ secrets.VITE_GH_TOKEN }}
          VITE_GH_OWNER: ${{ vars.VITE_GH_OWNER || 'hhrum' }}
          VITE_GH_REPO: ${{ vars.VITE_GH_REPO || 'autolux-landing' }}
          VITE_GH_MAIN_BRANCH: ${{ vars.VITE_GH_MAIN_BRANCH || 'main' }}
          VITE_GH_DRAFT_BRANCH: ${{ vars.VITE_GH_DRAFT_BRANCH || 'draft' }}
          VITE_GH_WORKFLOW_FILE: ${{ vars.VITE_GH_WORKFLOW_FILE || 'deploy.yml' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
